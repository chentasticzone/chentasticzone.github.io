<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chen! | 夢遊小陳 \\ Dev</title>
    <style>
        /* === 賽博參數面板 (你的調音台) === */
        :root {
            --main-color: #00ff41;      /* 核心霓虹綠 */
            --bg-color: #0a0a0a;        /* 深邃背景黑 */
            --text-dim: #888888;        /* 次要文字灰 */
            --border-style: 1px solid;  /* 邊框樣式 */
            --card-bg: #111111;         /* 卡片底色 */
            --glitch-speed: 1s;         /* 閃爍速度 */
            --container-width: 900px;   /* 頁面寬度 */
        }

        /* === 基礎架構 === */
        body { 
            background-color: var(--bg-color); 
            color: var(--main-color); 
            font-family: 'Courier New', monospace; 
            padding: 40px; 
            line-height: 1.6; 
            max-width: var(--container-width); 
            margin: auto; 
        }

        /* === 標題與導航 === */
        .header { border-left: 4px solid var(--main-color); padding-left: 20px; margin-bottom: 60px; }
        .subtitle { color: var(--text-dim); font-size: 1.1rem; }
        
        nav { margin-bottom: 50px; }
        .nav-btn { 
            color: var(--main-color); 
            text-decoration: none; 
            border: var(--border-style) var(--main-color); 
            padding: 8px 20px; 
            margin-right: 15px; 
            transition: 0.2s; 
        }
        .nav-btn:hover { background: var(--main-color); color: #000; box-shadow: 0 0 15px var(--main-color); }

        /* === 卡片系統 === */
        .section-title { font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 50px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 20px; }
        .card { 
            border: var(--border-style) #333; 
            background: var(--card-bg);
            padding: 25px; 
            transition: 0.3s; 
            position: relative; 
        }
        .card:hover { border-color: var(--main-color); transform: translateY(-3px); }
        .tag { font-size: 0.7rem; background: #222; color: #aaa; padding: 2px 8px; position: absolute; top: 0; right: 0; }

        /* === 系統底欄 === */
        .terminal-footer { margin-top: 100px; color: #444; font-size: 0.8rem; border-top: 1px solid #222; padding-top: 20px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor { display: inline-block; width: 10px; height: 18px; background: var(--main-color); animation: blink var(--glitch-speed) infinite; vertical-align: middle; }
    </style>
</head>
<body>
    <div class="header">
        <h1>chen! 夢遊小陳 \\ Root</h1>
        <p class="subtitle">想要走進二次元的小陳，總被導航到奇怪的地方。</p>
        <p>> 系統狀態：參數面板已就緒...<span class="cursor"></span></p>
    </div>

    <nav>
        <a href="#works" class="nav-btn">[ 音樂作品 ]</a>
        <a href="#lab" class="nav-btn">[ AI 實驗室 ]</a>
        <a href="#contact" class="nav-btn">[ 傳輸請求 ]</a>
    </nav>

    <div id="works" class="section-title">Latest Works</div>
    <div class="grid">
        <div class="card">
            <span class="tag">System: Online</span>
            <h3>不如隨波BAR</h3>
            <p>在數位洪流中，與其對抗，不如隨波。</p>
        </div>
    </div>

    <div class="terminal-footer">
        <p>CONFIG_MODE: ENABLED</p>
        <p>TIME: 2026.08.18 22:15 | READY FOR "OCEAN OF FORGETTING"</p>
    </div>
</body>
</html>
