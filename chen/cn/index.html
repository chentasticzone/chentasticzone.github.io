<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦游小陈 | chen!</title>
<link rel="icon" type="image/png" href="../icon.png">
<!-- 字型：Noto Sans SC（简中＋拉丁）；载入失败时自动退回系统字体，版面不会坏 -->

<style>
  @property --glow {
    syntax: "<color>";
    inherits: true;
    initial-value: #6a8fd8; /* 藍：第一首＝雨的節奏.funk */
  }

  :root {
    --bg: #ffffff;
    --fg: #1c1726;
    --muted: #9a94a2;
    --accent: #ff8a2b;      /* orange */
    --accent-2: #ffc48f;    /* light orange */
    /* 響應式基準：1280px 視窗時 = 原設計 400px；寬螢幕等比放大、小螢幕有下限 */
    --card-w: clamp(340px, 31.25vw, 600px);
    --card-h: calc(var(--card-w) * .75); /* 卡片＝4:3 畫框；圖用 contain 完整呈現、一律不裁切 */
    --u: clamp(.85px, .078125vw, 1.5px); /* 版面單位：1280px 視窗時 = 1px，按鍵/間距全部跟著縮放 */
    --logo-gray: #6a6a6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    min-height: 100%;
    overflow-x: hidden;
  }

  /* ---------- Header / centered logo ---------- */
    header {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 20px 0; /* 上方留白 -50%（原 40px，前輪已縮過一次） */
  }
  .logo-link {
    display: block;
    text-decoration: none;
  }
  .logo-img {
    height: 63px; /* 這裡原本是 42px，已放大 50% */
    width: auto;
    display: block;
  }
var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    user-select: none;
    text-align: center;
  }
  .logo span { color: var(--fg); -webkit-text-fill-color: var(--fg); font-weight: 300; }

  /* ---------- Coverflow gallery ---------- */
  .stage {
    position: relative;
    height: calc(var(--card-h) * 1.26); /* 隨卡片等比（原 315/250） */
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
    margin-top: -15px; /* LOGO↔图片视觉间距砍到约65%：原 3px＋header下缘2px，改为负距把整个舞台往上拉 */ /* LOGO↔图片留白减半：header下缘4px＋这里4px＝总计8px */
    touch-action: pan-y; /* 手機：垂直捲動保留，水平滑動給畫廊拖曳用 */
  }
  /* soft light-orange glow that only lives around the artwork */
  .stage::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: calc(var(--card-w) * 1.15);
    height: calc(var(--card-w) * 1.15);
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, color-mix(in srgb, var(--glow) 17%, transparent), color-mix(in srgb, var(--glow) 6%, transparent) 45%, transparent 70%);
    transition: --glow 1.2s cubic-bezier(.5,0,0,1); /* Fashion Slider 式背景換色 */
    pointer-events: none;
    z-index: 0;
  }
  .track {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    transform-style: preserve-3d;
    z-index: 1;
    transition: transform 1s cubic-bezier(.12,.8,.26,1); /* 拖曳放開：漸慢滑回/吸附（快起慢收） */
    will-change: transform;
  }
  .stage.dragging .track { transition: none; } /* 拖曳中：跟手，不要過場動畫 */
  .card {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--card-w);
    height: var(--card-h);
    border-radius: 9px; /* 圆角＝13px×0.67；实际形状由 squircle clip 决定 */
    overflow: hidden;
    cursor: pointer;
    transition: transform 1.1s cubic-bezier(.15,.78,.22,1), opacity .9s, filter .36s; /* 漸慢滑動曲線：快起慢收；filter＝模糊/亮度淡化 .36s（原 .9s 的 40%） */
    box-shadow: 0 10px 22px rgba(120,70,20,.12); /* 陰影縮小 */
    background: #f5f0ea;
    will-change: transform;
  }
  .imgwrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 9px;
    clip-path: url(#squircle); /* Apple 式连续倒角（套在裁切层，随卡片尺寸、不变形） */
    pointer-events: none;
  }
  .card img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;      /* 原圖完整呈現：任何比例都不裁切、不變形 */
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }
  /* 中央图片上的半透明播放键（圆角三角、纯指示用；点击穿透到卡片＝播放） */
  .playglyph {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    opacity: 0;
    transition: opacity .35s;
    pointer-events: none;
    z-index: 3;
  }
  .card.active .playglyph { opacity: 1; }
  .card.active.live .playglyph { opacity: 0; }
  .playglyph svg { filter: drop-shadow(0 2px 10px rgba(60,30,10,.28)); animation: breathe 1.875s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.091); } }
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 9px; /* 圆角＝13px×0.67；实际形状由 squircle clip 决定 */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    pointer-events: none;
  }
  .card.active {
    box-shadow: 0 14px 30px rgba(255,138,43,.20), 0 5px 14px rgba(120,70,20,.12);
  }
  /* 播放器：16:9，上下边贴齐图片上下边（宽度＝高×16/9，比图片略宽；小萤幕自动限宽不超出） */
  .vid {
    position: absolute;
    left: 50%;
    top: 50%;
    height: min(var(--card-h), calc((100vw - 12px) * 9 / 16));
    aspect-ratio: 16 / 9;
    transform: translate(-50%, -50%);
    z-index: 5;
    overflow: hidden;
    background: #000;
    box-shadow: 0 18px 44px rgba(60, 30, 10, .28);
  }
  .vid iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  /* B 方案熱區：左右各 33.4% 寬、垂直 20%~79%（依使用者 16:9 示意圖，避開 YT 頂欄與底部控制列）。
     熱區承接左右拖曳＝滑畫廊；中央與上下留白＝iframe 原生互動（進度條、音量、全螢幕、跳轉）。 */
  .vid .hz { position: absolute; top: 20%; height: 59%; width: 33.4%; z-index: 4; touch-action: pan-y; }
  .meta { touch-action: pan-y; -webkit-user-select: none; user-select: none; } /* 標題列整條可拖曳滑畫廊（點擊照舊） */
  .vid .hz.l { left: 0; }
  .vid .hz.r { right: 0; }
  /* 換曲＝停掉舊的、建立新的（B站無遠端控制） */
  .vid.off { display: none; }

  /* ---------- Now playing info ---------- */
  .meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(20 * var(--u));
    margin-top: 4px;
    min-height: clamp(36px, 3.13vw, 52px); /* 随视窗等比：1280px 时 40px */
    font-family: "Noto Sans SC", "Noto Sans", "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    /* 播放／暫停只綁中間文字塊 .mid（箭頭與兩側空白不再誤觸暫停） */
    -webkit-user-select: none;
    user-select: none;
  }
  .meta .mid { text-align: center; min-width: 0; cursor: pointer; }
  .meta .title { font-size: clamp(13px, 1.328vw, 20px); font-weight: 700; color: var(--logo-gray); transition: color .2s; }
      .meta:hover .title { color: #111; } /* 主标题＝LOGO 深灰（原本继承近黑）；1280px 时 17px */
  .meta.swap .title, .meta.swap .sub { animation: metaIn 1.1s cubic-bezier(.5,0,0,1) both; }
  .meta.swap .sub { animation-delay: .07s; }
  @keyframes metaIn {
    from { transform: translateX(var(--mdir, 44px)); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  .meta .sub { color: var(--muted); font-size: clamp(9px, .94vw, 14px); margin-top: calc(3 * var(--u)); letter-spacing: .04em; transition: color .2s; }
  .meta .mid:hover .sub { color: #d4b168; } /* 标题区 hover：副标也变假金色 */ /* 隨視窗等比：1280px 時 12px */

  /* ---------- Controls ---------- */
  /* 左右長箭頭（在標題兩側）＋點擊回饋 */
  .meta button {
    background: none;
    border: 0;
    padding: calc(10 * var(--u));
    cursor: pointer;
    color: var(--muted); /* 与副标题同色 */
    display: grid;
    place-items: center;
    transition: color .2s, transform .1s;
  }
  .meta button:hover { color: #d4b168; } /* 假金色 */
  .meta button:active { transform: scale(.9); }
  .arrow { width: calc(25 * var(--u)); height: auto; display: block; }

  /* ---------- Platform marquee ---------- */
  .platforms {
    margin-top: 20px; /* 與播放鍵間距 -40% */
    padding: 6px 0 38px; /* 跑馬燈整體高度 -20% */
  }
  .marquee {
    position: relative;
    overflow: hidden;
    mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .marquee-track {
    display: flex;
    align-items: center;
    width: max-content;
    will-change: transform; /* 位移由 JS 驅動：拖曳可隨時接手、放手後無縫恢復 */
  }
  .marquee {
    touch-action: pan-y; /* 手機：上下捲動留給頁面、左右滑動給跑馬燈 */
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .marquee.dragging { cursor: grabbing; }
  .marquee a { -webkit-user-drag: none; }

  /* logo lockup: no frame; dark gray by default, brand color on hover */
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-right: 39px; /* 間距 -35%（SVG 已緊貼裁切，間距一致） */
    text-decoration: none;
    white-space: nowrap;
    color: var(--logo-gray);
    transition: color .3s ease;
  }
  .brand svg {
    height: var(--h, 18px);
    width: auto;
    display: block;
  }
  /* 未 hover：統一深灰（白色部分鏤空、彩色裝飾隱藏）；hover：官方品牌色 */
  .brand .m, .brand .m2 { fill: var(--logo-gray); transition: fill .3s ease; }
  .brand .a { opacity: 0; transition: opacity .3s ease; }
  .brand .qn { fill: var(--logo-gray); transition: fill .3s ease; } /* 汽水音符：未 hover 一樣深灰 */
  .brand:hover { color: var(--brand); }
  .brand:hover .m  { fill: var(--brand); }
  .brand:hover .m2 { fill: var(--brand2, var(--brand)); }
  .brand:hover .a  { opacity: 1; }
  /* 經過頁面中線：淡入成 hover 配色，過了再淡出（JS 依位置加 .centered） */
  /* 速度分工：hover 一律走上方 .3s 快速；只有中線進出走 2s 慢速
     （進入＝.centered 覆蓋時長；離開＝JS 加 .slowmo 維持 2s，2.1s 後自動拆除還給快速） */
  .brand.centered:not(:hover), .brand.centered:not(:hover) .m,
  .brand.centered:not(:hover) .m2, .brand.centered:not(:hover) .qn,
  .brand.centered:not(:hover) .a, .brand.centered:not(:hover) .qng,
  .brand.slowmo:not(:hover), .brand.slowmo:not(:hover) .m,
  .brand.slowmo:not(:hover) .m2, .brand.slowmo:not(:hover) .qn,
  .brand.slowmo:not(:hover) .a, .brand.slowmo:not(:hover) .qng { transition-duration: 2s; }
  .brand.centered { color: var(--brand); }
  .brand.centered .m  { fill: var(--brand); }
  .brand.centered .m2 { fill: var(--brand2, var(--brand)); }
  .brand.centered .a  { opacity: 1; }
  /* 汽水音符汽水音符漸層：疊一層漸層複本 .qng 以 opacity 交叉淡化（fill 顏色↔url() 無法插值、會瞬跳，opacity 可以） */
  .brand .qng { opacity: 0; transition: opacity .3s ease; }
  .brand:hover .qng { opacity: 1; }
  .brand.centered .qng { opacity: 1; }

  @media (min-width: 1600px) { /* 寬螢幕：跑馬燈 logo 微幅放大，維持構圖比例 */
    .brand svg { height: calc(var(--h, 18px) * 1.22); }
    .brand { margin-right: calc(39px * 1.22); gap: calc(10px * 1.22); }
  }

  @media (max-width: 640px) {
    :root { --card-w: 300px; } /* --card-h / 區塊高自動跟著畫框比例走 */
    .logo { font-size: 34px; }
    .brand { margin-right: 29px; }
    .brand svg { height: calc(var(--h, 18px) * .85); }
  }
</style>

<script>
  // ------- 进站语言建议：页内横幅（胶囊同款半透明设计、图片同款倒角），每次工作阶段出现一次 -------
  (function () {
    try {
      const forceEarly = (/forcemsg=(sc|tc)/i.exec(location.search) || [])[1]; // 测试参数：不受「每个工作阶段只问一次」限制
      if (!forceEarly && sessionStorage.getItem("langAsked")) return;
      const simp = /^(zh-cn|zh-sg|zh-hans)(-|$)/i.test((navigator.language || "").trim());
      const onSimp = document.documentElement.lang === "zh-CN";
      // force 变数已在上方宣告（forceEarly）
      const goSimp = (!onSimp && simp) || (!onSimp && forceEarly === "sc");   // 繁體頁 × 簡中瀏覽器 → 邀請前往簡體版
      const goTrad = (onSimp && !simp) || (onSimp && forceEarly === "tc");   // 簡體頁 × 繁中瀏覽器 → 邀請前往繁體版
      if (!goSimp && !goTrad) return;
      sessionStorage.setItem("langAsked", "1");
      // 倒角「真的一样大」：squircle 是比例制定义，小元件上角落会小到看不见；改用与图片相同的「像素倒角」
      // 倒角「真的一样大」：不引用任何脚本变量（cards 是后面声明的 const、此处还在 TDZ 会招错），依视窗宽换算卡片实际宽（clamp(340px,31.25vw,600px)，手机 300px）
      const cw0 = window.innerWidth <= 640 ? 300 : Math.min(600, Math.max(340, window.innerWidth * .3125));
      const r = Math.max(6, Math.round(9 * cw0 / 400)); // 基准：400px 宽卡片的实际倒角约 9px，随实际卡宽等比
      const wrap = document.createElement("div"); // 外层只负责阴影：box-shadow 不被 clip 剪掉、也不贴着形状「框住」
      wrap.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;" +
        "border-radius:" + r + "px;box-shadow:0 10px 26px rgba(60,30,10,.16);transition:box-shadow .2s;";
      const bar = document.createElement("div"); // 内层：非常浅的半透明浅黄底＋与图片相同像素的倒角；不加 backdrop-blur（不模糊底下内容）
      bar.style.cssText =
        "display:flex;align-items:center;padding:12px 12px 12px 22px;" +
        "font-size:13px;font-weight:500;color:var(--logo-gray);letter-spacing:.02em;" +
        "border-radius:" + r + "px;background:rgba(255,254,247,.82);" +
        "user-select:none;white-space:nowrap;";
      wrap.addEventListener("mouseenter", () => wrap.style.boxShadow = "0 12px 32px rgba(60,30,10,.22)");

      if (mid >= r.left && mid <= r.right) lit = i;
    }
    for (let i = 0; i < marquee.children.length; i++) {
      const el = marquee.children[i], was = el.classList.contains("centered");
      el.classList.toggle("centered", i === lit);
      if (was && i !== lit) { // 離開中線：.slowmo 讓淡出也走 2s，計時拆除後 hover 恢復快速
        el.classList.add("slowmo");
        clearTimeout(el._smT);
        el._smT = setTimeout(() => el.classList.remove("slowmo"), 2100);
      }
    }
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

  marquee.addEventListener("pointerdown", (e) => {
    dragging = true; dragMoved = 0;
    startX = e.clientX; startOffset = offset;
    marquee.classList.add("dragging");
  });
  window.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    dragMoved = Math.max(dragMoved, Math.abs(dx));
    offset = startOffset - dx;
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    marquee.classList.remove("dragging");
    clearTimeout(resumeTimer);
    resumeTimer = setTimeout(() => { hoverPause = false; }, 1200);
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
  marquee.addEventListener("dragstart", (e) => e.preventDefault()); // 避免拉動連結觸發原生拖放
  marquee.addEventListener("click", (e) => {
    if (dragMoved > 6) { e.preventDefault(); e.stopPropagation(); } // 拖曳過視為滑動，不開連結
  }, true);
  marquee.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse" && !dragging) hoverPause = true; });
  marquee.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && !dragging) hoverPause = false; });

  setActive(DEFAULT_IDX); // 進站預設：We Share 在正中間

  // ------- 播放：純 iframe 內嵌（不用 YouTube IFrame API）-------
  // 錯誤 153「影片播放器設定錯誤」的元兇是 enablejsapi／IFrame API 的 origin 驗證：
  // 本機 file:// 的 origin 是 null → YouTube 直接拒播。
  // 對策：本機用「完全乾淨」的 embed 網址；正式網站（http/https）才加 enablejsapi＋正確 origin。
  // 換曲不銷毀播放器：舊的暫停＋隱藏（進度保留），點回來自動接著播。
  var playingIdx = -1;  // 正在播放的曲目（-1 = 沒在播）
  var hosts = {};       // 每首歌一個 .vid 容器
  const stageEl = document.querySelector(".stage"); // 彈出式播放器的容器＋騰位對象
  // 關鍵：enablejsapi 會啟動 origin 驗證，file:// 的 origin 是 null → 錯誤 153。
  const onWeb = location.protocol === "http:" || location.protocol === "https:";
  const apiParam = onWeb ? "&enablejsapi=1&origin=" + encodeURIComponent(location.origin) : "";

  // 近似续播：B站无法读取播放进度，改用计时器记录「这首已播几秒」，回来时带入 t=
  const playStart = {};   // 每首歌开始播放的时间戳
  const resumeAt = {};    // 离开时记下的秒数（下次回来从这里附近续播）
  function buildHost(i) {
    const tSec = resumeAt[i] > 1 ? Math.floor(resumeAt[i]) : 1; // 首播帶 t=1：B 站會忽略 t=0／沒帶 t（視同未設定→登入帳號從上次進度續播）；代價＝進度條從 0001 起跳
    const host = document.createElement("div");
    host.className = "vid";
    host.innerHTML =
      '<iframe src="https://player.bilibili.com/player.html?bvid=' + covers[i].bvid +
      '&autoplay=1&high_quality=1&danmaku=0&t=' + tSec + '" ' +
      'allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    playStart[i] = Date.now();
    ["l", "r"].forEach(function (s) { // B 方案熱區：左右拖曳＝滑畫廊（中央保留 iframe 原生控制）
      const z = document.createElement("div"); z.className = "hz " + s; host.appendChild(z);
    });
    stageEl.appendChild(host);   // 掛在 stage 層＝浮在當前圖片正上方，不進卡片裁切
    return host;
  }

  function playTrack(i) {
    setActive(i);
    // B站內嵌沒有遠端指令 API：換曲＝移除舊 iframe、建立新的（從頭播）
    if (playingIdx !== -1 && playingIdx !== i) {
      if (hosts[playingIdx]) { // 換曲前：用計時器記下這首播到第幾秒（誤差＝你在 iframe 裡手動暫停的時間也會被算進去）
        if (playStart[playingIdx]) resumeAt[playingIdx] = (Date.now() - playStart[playingIdx]) / 1000;
        hosts[playingIdx].remove();
        delete hosts[playingIdx];
      }
      cards[playingIdx].dataset.paused = "0";
    } else {
      resumeAt[i] = 0; // 重播同一首＝真的從頭
    }
    playingIdx = i;
    cards[i].dataset.paused = "0";
    if (hosts[i]) { hosts[i].remove(); delete hosts[i]; } // 重播同一首也重建
    hosts[i] = buildHost(i);            // 點擊觸發，autoplay 參數直接開播
    updateGlyphs();
  }
</script>
